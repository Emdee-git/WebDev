<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <title>Akatsuki</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Teko:wght@600;700&family=Noto+Serif+JP:wght@700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <section class="hero-parallax">
      <div
        class="hero-overlay d-flex flex-column justify-content-center align-items-center text-center p-3"
      >
        <div class="hero-line hero-line-top"></div>
        <div class="hero-line hero-line-bottom"></div>

        <div class="title-card p-3">
          <div class="kanji-font text-light fs-1 mb-1">暁</div>
          <div
            class="sports-font text-uppercase text-light tracking-wide fs-2 mb-0"
          >
            The Dawn of Peace
          </div>
          <h1 class="title-main sports-font text-danger mb-2">AKATSUKI</h1>
          <p class="text-light text-opacity-75 text-uppercase fs-5 mb-4">
            神羅天征
          </p>
          <a href="#teams-root" class="btn btn-danger sports-font fs-3 px-5">
            CHOOSE YOUR SYNDICATE
          </a>
        </div>
      </div>
    </section>

    <main class="container py-5">
      <div id="teams-root"></div>
    </main>

    <footer
      class="site-footer border-top border-danger border-opacity-25 py-4 mt-5"
    >
      <div class="container text-center">
        <div
          class="d-flex justify-content-center align-items-center gap-2 mb-2"
        >
          <span class="badge text-bg-danger sports-font fs-6">FAN MADE</span>
          <span class="text-secondary small">·</span>
          <span class="kanji-font text-danger-emphasis small">暁</span>
        </div>
        <p class="small text-secondary mb-0">
          This is a non-commercial, <strong>fan-made website</strong>. All
          related characters and trademarks belong to their respective owners.
        </p>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>

    <script>
      const akatsukiData = [
        {
          teamName: "Akatsuki",
          tagline: "神羅天征",
          themeBadge: "danger",
          members: [
            {
              id: 1,
              name: "Pain",
              village_name: "雨隠れの里",
              rank: "01",
              position: "Leader",
              image: "img/pain.jpg",
              desc: "The leader of Akatsuki, who commands the group through the Six Paths of Pain.",
            },
            {
              id: 2,
              name: "Konan",
              village_name: "雨隠れの里",
              rank: "02",
              position: "Co-Founder",
              image: "img/Konan.jpg",
              desc: "Pain's loyal partner and the paper-wielding angel of the organization.",
            },
            {
              id: 3,
              name: "Itachi Uchiha",
              village_name: "木ノ葉隠れの里",
              rank: "03",
              position: "Sharingan Prodigy",
              image: "img/itachi.jpg",
              desc: "A genius of the Uchiha clan who carried a heavy secret behind his calm eyes.",
            },
            {
              id: 4,
              name: "Kisame Hoshigaki",
              village_name: "霧隠れの里",
              rank: "04",
              position: "Swordsman",
              image: "img/kisame.jpg",
              desc: "A shark-like swordsman with enormous chakra and Itachi's longtime partner.",
            },
            {
              id: 5,
              name: "Hidan",
              village_name: "湯隠れの里",
              rank: "05",
              position: "Immortal Zealot",
              image: "img/hidan.jpg",
              desc: "A foul-mouthed devotee of Jashin who cannot be killed by ordinary means.",
            },
            {
              id: 6,
              name: "Deidara",
              village_name: "岩隠れの里",
              rank: "06",
              position: "Explosives Artist",
              image: "img/deidara.jpg",
              desc: "A bomber who believes true art is a fleeting, explosive moment.",
            },
            {
              id: 7,
              name: "Sasori",
              village_name: "砂隠れの里",
              rank: "07",
              position: "Puppet Master",
              image: "img/sasori.jpg",
              desc: "A master puppeteer who turned himself into a living puppet to preserve his art.",
            },
            {
              id: 8,
              name: "Kakuzu",
              village_name: "滝隠れの里",
              rank: "08",
              position: "Treasurer",
              image: "img/kakuzu.jpg",
              desc: "A greedy, long-lived treasurer who keeps extra hearts stitched into his body.",
            },
            {
              id: 9,
              name: "Zetsu",
              village_name: "なし",
              rank: "09",
              position: "Spy",
              image: "img/zetsu.jpg",
              desc: "A plant-like spy who can blend into the earth and gather information unseen.",
            },
            {
              id: 10,
              name: "Obito Uchiha",
              village_name: "木ノ葉隠れの里",
              rank: "10",
              position: "Masked Man",
              image: "img/obito.jpg",
              desc: "The masked figure pulling the strings from behind the organization.",
            },
          ],
        },
      ];

      const teamsRoot = document.getElementById("teams-root");
      const teamsToRender = akatsukiData.slice(0, 5);

      let fullHTML = "";

      for (let t = 0; t < teamsToRender.length; t++) {
        const team = teamsToRender[t];
        const panelMembers = team.members.slice(0, 10);

        fullHTML += `
          <section class="team-section mb-5 pb-4">
            <div class="d-flex justify-content-center mb-2">
              <h2 class="sports-font display-6 mb-0">${team.teamName}</h2>
            </div>
            <p class="text-secondary text-center mb-4">${team.tagline}</p>

            <div class="collage-container mx-auto d-flex flex-column gap-2 p-2 rounded-3" id="gallery-${t}">
        `;

        for (let p = 0; p < panelMembers.length; p++) {
          const m = panelMembers[p];
          fullHTML += `
            <div class="panel position-relative overflow-hidden rounded-2">
              <span class="photo-placeholder sports-font text-danger text-opacity-50 d-flex justify-content-center align-items-center h-100">PHOTO ${m.rank}</span>
              <img src="${m.image}" alt="${m.name}" loading="lazy" onerror="this.remove()" />
              <div class="panel-bar d-flex align-items-center gap-3 px-4">
                <span class="sports-font text-danger fs-1">${m.rank}</span>
                <h3 class="sports-font mb-0 text-white">${m.name}</h3>
                <span class="sports-font text-uppercase text-light-emphasis ms-auto">${m.position}</span>
              </div>
              <div class="panel-details">
                <button class="close-btn" title="Close details">&times;</button>
                <div class="mb-2">
                  <span class="badge text-bg-${team.themeBadge}">#${m.rank} · ${m.position}</span>
                </div>
                <h3 class="sports-font mb-0 text-white">${m.name}</h3>
                <h5 class="kanji-font text-danger-emphasis mb-2">${m.village_name}</h5>
                <p class="small text-light-emphasis mb-0">${m.desc}</p>
              </div>
            </div>
          `;
        }

        fullHTML += `</div></section>`;
      }

      teamsRoot.innerHTML = fullHTML;

      document.addEventListener("click", (e) => {
        const closeBtn = e.target.closest(".close-btn");
        const panel = e.target.closest(".panel");

        if (closeBtn) {
          e.stopPropagation();
          const activePanel = closeBtn.closest(".panel.active");
          const container = closeBtn.closest(".collage-container");
          if (activePanel && container) {
            activePanel.classList.remove("active");
            container.classList.remove("has-active");
          }
          return;
        }

        if (panel) {
          const container = panel.closest(".collage-container");
          if (!container) return;

          if (panel.classList.contains("active")) return;
          const currentActive = container.querySelector(".panel.active");
          if (currentActive) {
            currentActive.classList.remove("active");
          }

          panel.classList.add("active");
          container.classList.add("has-active");
        }
      });
    </script>
  </body>
</html>
